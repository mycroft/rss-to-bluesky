name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CHART: charts/rss-to-bluesky
  CHART_REPOSITORY: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: build binaries
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            echo "building ${GOOS}/${GOARCH}"
            go build -trimpath \
              -ldflags="-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA}" \
              -o rss-to-bluesky ./cmd/rss-to-bluesky
            tar -czf "dist/rss-to-bluesky_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}.tar.gz" rss-to-bluesky
            rm rss-to-bluesky
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
          ls -la dist

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*

  # A vX.Y.Z tag publishes the image as X.Y.Z, the tag the chart deploys.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: compute version
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          # Links the package to this repository.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

  # The chart's version and appVersion follow the release tag, so it deploys
  # the image built from the same tag. Pushed after the image, so the chart
  # never points at an image that does not exist yet.
  chart:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1

      - name: package chart
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package "${CHART}" --version "${version}" --app-version "${version}" --destination dist
          echo "file=dist/rss-to-bluesky-${version}.tgz" >> "${GITHUB_OUTPUT}"

      - name: push chart
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          FILE: ${{ steps.package.outputs.file }}
        run: |
          echo "${GH_TOKEN}" | helm registry login ghcr.io --username "${ACTOR}" --password-stdin
          helm push "${FILE}" "${CHART_REPOSITORY}"
