{{- if not .Values.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rss-to-bluesky.fullname" . }}
  labels:
    {{- include "rss-to-bluesky.labels" . | nindent 4 }}
  annotations:
    # Losing the database reposts the whole feed: keep it on uninstall.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
